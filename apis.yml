name: Milk *
description: 'Milk, Inc. was a mobile application development lab founded in 2011 by
  Kevin Rose, Daniel Burka, and Jeff Hodsdon, and backed by GV (Google Ventures).
  Its only shipped product was Oink, an app for rating and discovering real-world
  things. Milk shut down Oink in early 2012 and the product team was acqui-hired by
  Google in March 2012, after which the company ceased to exist. It is defunct with
  no active website, developer portal, SDKs, or public API surface. This profile was
  added to the API Evangelist network as a GV portfolio lead; enrichment confirmed
  there is no API to catalog.'
